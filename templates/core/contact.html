{% extends "base.html" %}
{% block title %}Contact{% endblock %}
{% block content %}
<div class="page-header">
  <div class="container">
    <h1>Contact Us</h1>
    <p>We're here to help — reach out any time.</p>
  </div>
</div>
<div class="container">
  <div style="max-width:600px;margin:0 auto">
    <div class="card" style="margin-bottom:1.5rem">
      <div class="card-body">
        <h2 style="margin-bottom:1.5rem;font-size:1.3rem">Send a Message</h2>
        <form method="post" action="{% url 'tickets:support_ticket' %}">
          {% csrf_token %}
          <div class="form-group">
            <label for="id_name">Your Name</label>
            <input type="text" class="form-control" id="id_name" name="name" required placeholder="Jane Smith" />
          </div>
          <div class="form-group">
            <label for="id_email">Email Address</label>
            <input type="email" class="form-control" id="id_email" name="email" required placeholder="jane@example.com" />
          </div>
          <div class="form-group">
            <label for="id_subject">Subject</label>
            <input type="text" class="form-control" id="id_subject" name="subject" required placeholder="How can we help?" />
          </div>
          <div class="form-group">
            <label for="id_description">Message</label>
            <textarea class="form-control" id="id_description" name="description" rows="5" required placeholder="Describe your question or issue…"></textarea>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%">Send Message</button>
        </form>
      </div>
    </div>
    <div class="grid grid-2">
      <div class="card"><div class="card-body" style="text-align:center">
        <div style="font-size:2rem;margin-bottom:.5rem">📧</div>
        <h3 class="card-title">Email</h3>
        <p class="card-text">support@ticketsite.example</p>
      </div></div>
      <div class="card"><div class="card-body" style="text-align:center">
        <div style="font-size:2rem;margin-bottom:.5rem">🤖</div>
        <h3 class="card-title">AI Chat</h3>
        <p class="card-text">Use TicketBot (bottom-right) for instant answers.</p>
      </div></div>
    </div>
  </div>
</div>
{% endblock %}
